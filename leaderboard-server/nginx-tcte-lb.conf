# TCTE 生日小遊戲排行榜 API (tcte-leaderboard.service, 127.0.0.1:8787)
# 經過 Cloudflare 代理時，真正的玩家 IP 在 CF-Connecting-IP (排行榜用來限制上傳頻率)
map $http_cf_connecting_ip $tcte_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
server {
    server_name tcte-lb.kevinjja.dpdns.org;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $tcte_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tcte-lb.kevinjja.dpdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tcte-lb.kevinjja.dpdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = tcte-lb.kevinjja.dpdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name tcte-lb.kevinjja.dpdns.org;
    return 404; # managed by Certbot


}