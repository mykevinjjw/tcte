# 舊的後台網址：後台已經搬到 https://games.mykevin.dpdns.org/admin/ (nginx-games.conf)，這裡只負責轉址
# 先只放 listen 80 的 server，再執行 certbot --nginx -d tcteback.kevinjja.dpdns.org 加上 HTTPS
server {
    listen 80;
    server_name tcteback.kevinjja.dpdns.org;
    return 301 https://games.mykevin.dpdns.org/admin$request_uri;
}
