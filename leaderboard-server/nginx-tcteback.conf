# TCTE 生日小遊戲管理後台 (tcte-admin.service, 127.0.0.1:8788)
# $tcte_client_ip 定義在 tcte-lb.conf (真正的 IP 在 CF-Connecting-IP，後台用來限制登入失敗次數)
# 先只放 listen 80 的 server，再執行 certbot --nginx -d tcteback.kevinjja.dpdns.org 加上 HTTPS
server {
    listen 80;
    server_name tcteback.kevinjja.dpdns.org;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $tcte_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
