# 遊戲網站 games.mykevin.dpdns.org：遊戲主頁與各個遊戲 (靜態檔案，repo 的 games-site/) + 管理後台 (/admin/)
# $tcte_client_ip 定義在 tcte-lb.conf (真正的 IP 在 CF-Connecting-IP，後台用來限制登入失敗次數)
# 先只放 listen 80 的 server，再執行 certbot --nginx -d games.mykevin.dpdns.org --redirect 加上 HTTPS
server {
    listen 80;
    server_name games.mykevin.dpdns.org;
    root /var/www/tcte-games;
    index index.html;
    client_max_body_size 64k;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # 管理後台 (tcte-admin.service, 127.0.0.1:8788)；結尾的 / 會把網址前面的 /admin 拿掉再轉送
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $tcte_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
