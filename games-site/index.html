<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小遊戲</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <link rel="stylesheet" href="site.css?v=6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="games-top">
        <a class="games-countdown-link" href="https://mykevinjjw.github.io/tcte/">⏳ 統測倒數</a>
    </nav>
    <main class="games-main">
        <h1>🎮 小遊戲</h1>
        <p class="games-sub">讀書累了，來玩一下吧！</p>
        <div class="games-list">
            <a class="game-card" href="birthday/" data-status-game="birthday">
                <span class="game-card-icon">🧸</span>
                <h2>幼兒園照顧大作戰</h2>
                <p>60 秒內照顧整班小朋友，分數會上排行榜。</p>
                <span class="game-card-status">查詢中…</span>
            </a>
            <a class="game-card" href="snake/">
                <span class="game-card-icon">🐍</span>
                <h2>貪吃蛇</h2>
                <p>吃掉課本和考卷越長越長，三種速度，有自己的排行榜。</p>
                <span class="game-card-status open">🎉 隨時都能玩</span>
            </a>
            <div class="game-card soon">
                <span class="game-card-icon">🧩</span>
                <h2>更多遊戲</h2>
                <p>敬請期待</p>
            </div>
        </div>
    </main>
    <footer class="games-footer">&copy; 2025 TCTE Countdown. Designed by 黃逸凱 (mykevinjjw).</footer>
    <script src="https://code.jquery.com/jquery-3.6.2.min.js"></script>
    <script src="common.js?v=6"></script>
    <script>
        (function ($) {
            var G = window.TcteGames;
            $('.games-countdown-link').on('click', function () {
                this.href = G.linkWithIdentity(G.COUNTDOWN_URL);
            });
            // 幼兒園照顧大作戰的開放狀態 (由管理後台設定)
            G.request('/status').then(function (status) {
                $('[data-status-game="birthday"] .game-card-status')
                    .text(status.open ? '🎉 開放中' : '暫停中，可以看排行榜')
                    .toggleClass('open', status.open === true);
            }).catch(function () {
                $('[data-status-game="birthday"] .game-card-status').text('連不上伺服器');
            });
        })(jQuery);
    </script>
</body>

</html>
